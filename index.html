<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="./styles/index.css">
        <link rel="icon" type="image/x-icon" href="./favicon.png">
        <!-- <link rel="manifest" href="manifest.json"/> -->
        <title>WebRTC Voicechat</title>
    </head>
    <body>
        <h1>WebRTC Voicechat</h1>

        <p>
            <select id="microphone-selector" class="selector">
                <option id="selector-options-info" value="info">Buscando entradas de audio...</option>
            </select>
            <label id="mic-selector-label" for="microphone-selector">Entrada de audio</label>
        </p>

        <p id="ss-controls">
            <button id="ss-connect">Conectar al servidor</button>
            <input type="text" id="ss-pw" placeholder="Contraseña" autocomplete="current-password">
        </p>

        <div id="call-controls" hidden>


            <p>
                <button id="connect-button">Conectar llamada</button>
                <button id="disconnect" disabled>Desconectar</button>
                <span id="connect-status"></span>
            </p>

            <p>
                <button id="message-button">Enviar mensaje</button>
            </p>
        </div>


        <p id="info-msg" style="font-size: 12px; margin: 0; height: 15px;" class="fadeOut" onanimationend="this.innerText = '';"></p>

        <audio id="remote-audio" autoplay></audio>

        <button id="language-switch">🌐</button>

        <script type="module" src="./webrtcClient 2.mjs"></script>
    </body>
</html>
